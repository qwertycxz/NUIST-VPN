# yaml-language-server: $schema=https://schemastore.org/github-workflow
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: zip -j ${{ runner.temp }}/NUIST-VPN.zip dist/*
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          append_body: true
          discussion_category_name: Announcements
          files: ${{ runner.temp }}/NUIST-VPN.zip
          generate_release_notes: true
          make_latest: true
on:
  push:
    tags:
      - v*
permissions:
  contents: write
  discussions: write
